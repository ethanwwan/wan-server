name: Docker Build and Push

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.4.5). Leave empty to build main HEAD.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wan-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 算镜像 tag：去掉 ref name / 输入 tag 的 'v' 前缀
      #   push tag v1.4.7       → image 1.4.7 + latest
      #   workflow_dispatch v1.4.8 → image 1.4.8 + latest
      #   workflow_dispatch empty → image sha-<7>
      - name: Compute image tag
        id: img
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          # 去掉 v 前缀 (v1.4.7 → 1.4.7)
          SEMVER="${RAW_TAG#v}"
          # 是否 prerelease: 含 '-'
          if [[ "${SEMVER}" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "semver=${SEMVER}"       >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo ">> image tag will be: ${SEMVER} (prerelease=${IS_PRERELEASE})"

      # 直接用 buildx --push，明确指定 tag，无 metadata-action 黑盒
      #   镜像 1: <semver>            (必推)
      #   镜像 2: latest              (非 prerelease 时)
      #   镜像 3: latest-prerelease   (prerelease 时)
      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # tags: 多行字符串会被自动按行分割为 tag 列表
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.img.outputs.semver }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ steps.img.outputs.is_prerelease == 'true' && '-prerelease' || '' }}
          labels: |
            org.opencontainers.image.title=wan-server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.img.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 🐳 Docker 镜像 (GHCR)

            镜像已推送到 GitHub Container Registry：

            ```bash
              docker run -d \
                --name wan-server \
                -p 8016:8016 \
                -v $(pwd)/server/input:/app/server/input \
                -v $(pwd)/server/output:/app/server/output \
                --restart unless-stopped \
                ghcr.io/${{ github.repository_owner }}/wan-server:${{ steps.img.outputs.semver }}
            ```

            **访问地址**：`http://localhost:8016`
