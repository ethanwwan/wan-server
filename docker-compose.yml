services:
  wan-server:
    image: ghcr.1ms.run/ethanwwan/wan-server:latest
    container_name: wan-server
    restart: unless-stopped
    ports:
      - "8016:8016"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./server/input:/app/server/input
      - ./server/output:/app/server/output
